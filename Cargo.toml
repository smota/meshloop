[workspace]
members = [
    "crates/meshloop-domain",
    "crates/meshloop-context",
    "crates/meshloop-engine",
    "crates/meshloop-adapters",
    "crates/meshloop-cli",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/smota/meshloop"
homepage = "https://github.com/smota/meshloop"
authors = ["Samuel"]

# Keep path+version in lockstep with workspace.package.version (ADR 0018).
[workspace.dependencies]
meshloop-domain = { path = "crates/meshloop-domain", version = "0.1.0" }
meshloop-context = { path = "crates/meshloop-context", version = "0.1.0" }
meshloop-engine = { path = "crates/meshloop-engine", version = "0.1.0" }
meshloop-adapters = { path = "crates/meshloop-adapters", version = "0.1.0" }
sha2 = { version = "0.10", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
