[package]
name = "meshloop-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Meshloop orchestration engine: plan, route, verify, recover. Ports only."
readme = "README.md"
keywords = ["orchestration", "agents"]
categories = ["development-tools"]

[lints]
workspace = true

# serde_json: the planner (ADR 0009/runtime-design.md §5) parses a decomposition agent's
# declared JSON task-graph output contract; no other I/O added here.
[dependencies]
meshloop-domain = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
