[package]
name = "meshloop-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Meshloop adapters: CLI harnesses, git worktrees, SQLite, and the fixture harness."
readme = "README.md"
keywords = ["orchestration", "agents", "git"]
categories = ["development-tools"]

[lints]
workspace = true

# rusqlite (bundled): ADR 0007/runtime-design.md §4's embedded local persistence — bundled
# avoids depending on a system-installed SQLite across Windows/WSL.
[dependencies]
meshloop-domain = { workspace = true }
meshloop-engine = { workspace = true }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", default-features = false }

[[bin]]
name = "fixture_harness"
path = "src/bin/fixture_harness.rs"
