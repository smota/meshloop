[package]
name = "meshloop-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Multi-agent development optimization and loop engineering runtime for AI coding agents."
readme = "README.md"
keywords = ["agents", "multi-agent", "loop-engineering", "development-tools"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**",
    "session-bundle/**",
    "Cargo.toml",
    "README.md",
    "tests/**",
]

[lints]
workspace = true

# toml: parses config/meshloop.example.toml-shaped configuration (ADR 0001/0003/0009);
# serde/serde_json: task-graph (de)serialization for `plan`'s output file and `run`'s input.
[dependencies]
meshloop-domain = { workspace = true }
meshloop-context = { workspace = true }
meshloop-engine = { workspace = true }
meshloop-adapters = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "meshloop"
path = "src/main.rs"
