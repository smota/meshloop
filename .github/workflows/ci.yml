name: CI Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-and-gate:
    name: ${{ matrix.os }} - check, smoke, bench
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: clippy, rustfmt
      - name: Fetch dependencies
        run: cargo fetch --locked
      # #138: tests/nodecode_containment.rs runs adapters/nodecode/containment-test.sh,
      # which skips without bubblewrap or unprivileged user namespaces. Install bwrap and
      # make the test required (MESHLOOP_REQUIRE_CONTAINMENT=1, a skip then fails) only
      # where the probe shows the sandbox can be built; ubuntu-24.04's AppArmor policy
      # may block user namespaces, and then the test skips with that reason.
      - name: Containment prerequisites (Linux)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          if ! { sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap; }; then
            echo "::warning title=nodecode containment test skips::bubblewrap could not be installed on this runner"
            exit 0
          fi
          bwrap --version
          if probe="$(bwrap --unshare-user --disable-userns --unshare-pid --unshare-ipc \
                --unshare-uts --unshare-cgroup-try --die-with-parent --new-session \
                --ro-bind / / true 2>&1)"; then
            echo "MESHLOOP_REQUIRE_CONTAINMENT=1" >> "$GITHUB_ENV"
            echo "bwrap builds the sandbox here: the nodecode containment test is required"
          else
            echo "::notice title=nodecode containment test skips::bwrap cannot build the sandbox on this runner: ${probe}"
          fi
      - name: Static Analysis & Workspace Unit Tests
        run: cargo run -p xtask -- check
      - name: CLI dispatch scaffold
        run: cargo test -p xtask --test scaffold_cli --locked --offline
      - name: End-to-End Sandbox Smoke Test
        run: cargo run -p xtask -- smoke
      - name: Algorithmic & Invariant Benchmark Suite
        run: cargo run --release -p xtask -- bench
      - name: System 1 offline bench
        run: cargo run --release -p xtask -- bench-system1
      - name: Upload Benchmark & Scorecard Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-artifacts-${{ matrix.os }}
          path: |
            artifacts/bench/run.json
            artifacts/bench/scorecard.md
            artifacts/bench/system1_bench.json

  # Optional nodecode cell check (ADR 0038, #135). Non-blocking: it installs a pinned
  # nodecode release on a throwaway HOME, loads cells/nodecode-meshloop and runs its load
  # test. It is never called from xtask or cargo test; the blocking contract is
  # crates/meshloop-cli/tests/nodecode_cell_contract.rs. Needs glibc 2.38 or newer.
  nodecode-cell:
    name: optional - nodecode cell load (non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    timeout-minutes: 20
    env:
      NODECODE_VERSION: 98dd6dc80
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Build meshloop and the fixture harness
        run: cargo build --locked -p meshloop-cli -p meshloop-adapters --bins
      # The installer is the MIT install.sh shipped inside the pinned release, vendored in
      # cells/nodecode-meshloop/test/vendor/ (nodecode.ai serves install.sh unversioned, so a
      # downloaded copy changes with every release). It and the executable are checked
      # against cells/nodecode-meshloop/test/nodecode-$NODECODE_VERSION.sha256 before either
      # runs; the installer checks the tarball against the release's published sha256.
      - name: Install the pinned nodecode release on a throwaway HOME
        run: |
          sums="$GITHUB_WORKSPACE/cells/nodecode-meshloop/test/nodecode-$NODECODE_VERSION.sha256"
          home="$RUNNER_TEMP/nodecode-install"
          mkdir -p "$home" "$RUNNER_TEMP/nodecode-installer"
          cd "$RUNNER_TEMP/nodecode-installer"
          cp "$GITHUB_WORKSPACE/cells/nodecode-meshloop/test/vendor/nodecode-install-$NODECODE_VERSION.sh" install.sh
          grep '  install.sh$' "$sums" | sha256sum -c -
          env -i HOME="$home" PATH=/usr/bin:/bin LANG=C.UTF-8 NODECODE_VERSION="$NODECODE_VERSION" \
            sh ./install.sh --no-modify-path
          cd "$home/.local/share/nodecode/$NODECODE_VERSION"
          grep '  nodecode$' "$sums" | sha256sum -c -
          ./nodecode --version
      - name: Load the cell and run doctor, status and inspect
        run: |
          python3 -I cells/nodecode-meshloop/test/load_test.py \
            --meshloop "$PWD/target/debug/meshloop" \
            --fixture-harness "$PWD/target/debug/fixture_harness" \
            --nodecode "$RUNNER_TEMP/nodecode-install/.local/share/nodecode/$NODECODE_VERSION/nodecode" \
            --work "$RUNNER_TEMP/nodecode-cell"
