# Manual dry-run for the two ADR 0018 binary names.
# Builds meshloop with --locked, records SHA-256, and uploads the pair as a
# workflow artifact. It does not create a GitHub Release and does not publish
# crates. xtask stays unpublished.
name: Release binary dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: meshloop-linux-x86_64
            source: target/release/meshloop
          - os: windows-latest
            target: meshloop-windows-x86_64.exe
            source: target/release/meshloop.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Build meshloop
        run: cargo build -p meshloop-cli --bin meshloop --locked --offline --release
      - name: Record SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -f "${{ matrix.source }}"
          cp "${{ matrix.source }}" "${{ matrix.target }}"
          if command -v python3 >/dev/null 2>&1; then
            py=python3
          else
            py=python
          fi
          "$py" -c 'import hashlib, pathlib, sys; path = pathlib.Path(sys.argv[1]); digest = hashlib.sha256(path.read_bytes()).hexdigest(); digest_path = pathlib.Path(str(path) + ".sha256"); digest_path.write_text(digest + "\n"); print("artifact=" + path.name); print("bytes=" + str(path.stat().st_size)); print("sha256=" + digest)' "${{ matrix.target }}"
      - name: Upload binary and digest
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ matrix.target }}
            ${{ matrix.target }}.sha256
          if-no-files-found: error
