  <g fill="none" stroke="#8A9AA3" stroke-width="2.5" stroke-linecap="round">
    <line x1="64" y1="24" x2="104" y2="64"/>
    <line x1="104" y1="64" x2="64" y2="104"/>
    <line x1="64" y1="104" x2="24" y2="64"/>
    <line x1="24" y1="64" x2="64" y2="24"/>
  </g>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#4FBFB8" stroke-width="6"/>
  <circle cx="64" cy="24" r="5.5" fill="#4FBFB8"/>
  <circle cx="64" cy="24" r="2.2" fill="#1B2429"/>
  <circle cx="104" cy="64" r="5.5" fill="#4FBFB8"/>
