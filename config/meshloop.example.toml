# Product config: direct CLI workers. No credentials. Fixture is the CI double
# (config/meshloop.fixture.toml) and `--fixture-only`.
#
# `kind` is the harness identifier. Isolation is git worktrees.
#
# Live dispatch is not claimed here. Templates below are copied from each CLI's own
# help at the version in that harness's comment. Meshloop ships no per-harness CLI
# flags (ADR 0003).
#
# Placeholders are replaced inside an argument, not only as a whole argument:
# `{prompt_file}` is the prompt file path, `{model_ref}` is the model, and `{prompt}`
# is the prompt text. `{prompt}` expands for `prompt_via = "arg"`, and for `stdin`
# only when the template contains it. Unknown `{...}` tokens stay literal.
# `prompt_via` is `file` (default), `arg`, or `stdin`. Any other value is a config
# error that names the harness. Stdin is null unless `prompt_via` is `stdin`.
# An empty `invoke_args_template` is probed but never dispatched. Check with:
#   meshloop doctor --config meshloop.toml
#
# Models: an entry sets either `model_ref` (+ optional `model_tier`) or a `models` list,
# e.g. `models = [{ model_ref = "a", model_tier = "mid" }, { model_ref = "b", model_tier = "top" }]`.
# Routing makes each (harness, model) its own candidate with its own feedback. The
# templates below do not pass `{model_ref}`, so each CLI runs its own default model.
# The commented "model example" lines show how an operator passes it; they are
# examples, not shipped defaults. See docs/engineering/harnesses.md#model-selection.
selected_harnesses = ["grok", "claude", "codex"]

[limits]
max_concurrent_workers = 1
# Maximum attempts per task (the first dispatch counts). 2 means one fallback.
max_retries = 2
task_timeout_seconds = 300
# Deadline for each harness's version probe. A probe that does not exit (an interactive UI,
# an auth prompt) marks that harness unsupported instead of blocking `plan`.
probe_timeout_seconds = 15

[verify]
# Optional structured argv run in the attempt worktree after git-diff. Empty = git-diff only.
verify_command = []

# Optional worktree root for new runs. Relative paths resolve from the repository.
# Absolute paths are allowed. Omit this table to use `<repo>/.meshloop/worktrees`
# after a fail-closed Git layout probe. Existing runs stay on their registered roots.
# auto_reclaim (default true): once a run is fully integrated and its result is
# reachable from the checked-out base branch, reclaim its worktrees and
# meshloop/<graph>/ branches through digest-bound cleanup. Set false to keep them
# and print the exact `meshloop workspace apply --cleanup ...` command instead.
# Failed, cancelled, unowned and dirty worktrees are never reclaimed.
# [workspace]
# root = "shorter-root"
# auto_reclaim = true

# Optional. The planner is routed as a Tier3 task, which only model_tier = "top" fits.
# Name a harness to plan with whatever its tier, or lower the routing tier; not both.
# [planner]
# harness = "claude"
# tier = "Tier2"

[harnesses.grok]
kind = "grok"
executable = "grok"
# Read-only probe; must exit without interaction. Defaults to ["--version"].
version_args = ["--version"]
# grok 1.0.70 (f50904eaee6c) [stable]. `grok --help` shows `--prompt-file <PATH>`
# ("Single-turn prompt from a file"). `prompt_via` stays the default `file`.
# Live dispatch was not run.
invoke_args_template = ["--prompt-file", "{prompt_file}"]
model_ref = "grok"
model_tier = "top"
# Model example (grok 1.0.77: `grok --help` shows `-m, --model <MODEL>`; `grok models`
# lists IDs). Replace the three lines above with:
# invoke_args_template = ["--model", "{model_ref}", "--prompt-file", "{prompt_file}"]
# models = [{ model_ref = "<model-id>", model_tier = "top" }]

[harnesses.claude]
kind = "claude"
executable = "claude"
# 2.1.316 (Claude Code). `claude --help` shows `-p, --print` ("Print response and
# exit") and argument `prompt` ("Your prompt"). Live dispatch was not run.
prompt_via = "arg"
invoke_args_template = ["--print", "{prompt}"]
model_ref = "claude"
model_tier = "top"
# Model example (2.1.322: `claude --help` shows `--model <model>`, an alias such as
# `sonnet` or a full model name). Replace the three lines above with:
# invoke_args_template = ["--print", "--model", "{model_ref}", "{prompt}"]
# models = [{ model_ref = "sonnet", model_tier = "mid" }, { model_ref = "opus", model_tier = "top" }]

[harnesses.codex]
kind = "codex"
executable = "codex"
# codex-cli 0.165.0. `codex --help` lists `exec` ("Run Codex non-interactively").
# `codex exec --help` shows `[PROMPT]` and that `-` reads instructions from stdin.
# Live dispatch was not run.
prompt_via = "stdin"
invoke_args_template = ["exec", "-"]
model_ref = "codex"
model_tier = "top"
# Model example (codex-cli 0.167.0: `codex exec --help` shows `-m, --model <MODEL>`).
# Replace the three lines above with:
# invoke_args_template = ["exec", "--model", "{model_ref}", "-"]
# models = [{ model_ref = "<model-id>", model_tier = "top" }]

[harnesses.pi]
kind = "pi"
executable = "pi"
# 1.4.0. `pi --help` shows `--print, -p` ("Non-interactive mode: process prompt
# and exit") and the example `pi -p "..."`. Live dispatch was not run.
prompt_via = "arg"
invoke_args_template = ["-p", "{prompt}"]
model_ref = "pi"
model_tier = "mid"

[harnesses.agy]
kind = "agy"
executable = "agy"
# 1.4.12. `agy --help` (usage on stderr) shows `--print` / `-p` ("Run a single
# prompt non-interactively") but not where the prompt text is passed. Not verified.
# Live dispatch was not run.
model_ref = "agy"
model_tier = "mid"
