# Product config: live Herdr workers. No credentials. Fixture is the CI double
# (config/meshloop.fixture.toml) and `--fixture-only`.
#
# `kind` is the Herdr `--kind`. `executable` is unused for live dispatch; keep it
# as a local probe hint. Isolation is git worktrees, not panes.
selected_harnesses = ["grok", "claude", "codex"]

[limits]
max_concurrent_workers = 1
# Maximum attempts per task (the first dispatch counts). 2 means one fallback.
max_retries = 2
task_timeout_seconds = 300

[verify]
# Optional structured argv run in the attempt worktree after git-diff. Empty = git-diff only.
verify_command = []

[harnesses.grok]
kind = "grok"
executable = "grok"
model_ref = "grok"
model_tier = "top"

[harnesses.claude]
kind = "claude"
executable = "claude"
model_ref = "claude"
model_tier = "top"

[harnesses.codex]
kind = "codex"
executable = "codex"
model_ref = "codex"
model_tier = "top"

[harnesses.pi]
kind = "pi"
executable = "pi"
model_ref = "pi"
model_tier = "mid"

[harnesses.agy]
kind = "agy"
executable = "agy"
model_ref = "agy"
model_tier = "mid"
