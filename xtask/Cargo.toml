[package]
name = "xtask"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
meshloop-domain.workspace = true
meshloop-context.workspace = true
meshloop-engine.workspace = true
meshloop-adapters.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Smoke seeds a disposable schema-8 ledger. SqliteStore keeps its connection crate-private.
rusqlite = { version = "0.31", features = ["bundled"] }
hdrhistogram = { version = "7.6", default-features = false }

[[test]]
name = "scaffold_cli"
path = "../tests/scenarios/scaffold_cli.rs"
